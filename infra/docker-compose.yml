services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: po_v2_postgres
    environment:
      POSTGRES_USER: po
      POSTGRES_PASSWORD: po
      POSTGRES_DB: po_v2
    ports:
      - "54321:5432"
    volumes:
      - po_v2_pgdata:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro

  redis:
    image: redis:7
    container_name: po_v2_redis
    ports:
      - "63791:6379"

volumes:
  po_v2_pgdata:
